<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 12 · Exercise 2: Task List</title>
  <!-- React + Babel from a CDN, so JSX works in one HTML file -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 20px; background: #F3F6F5; color: #172B2A; line-height: 1.6; }
    h1 { color: #1E7466; margin-bottom: 4px; }
    .intro { color: #4A5F5C; margin-top: 0; }
    .box { background: #fff; border: 1px solid #D5DFDC; border-radius: 14px; padding: 20px 22px; margin-top: 20px; }
    button { font-family: inherit; font-size: 15px; padding: 8px 16px; border-radius: 8px; border: 1px solid #1E7466; background: #1E7466; color: #fff; cursor: pointer; }
    button.light { background: #fff; color: #1E7466; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #F5B642; outline-offset: 2px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid #B9CCC7; border-radius: 8px; }
    ul.tasks { list-style: none; padding: 0; margin: 16px 0 0; }
    ul.tasks li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #E2E9E6; }
    .x { background: #fff; color: #9B1C1C; border-color: #9B1C1C; padding: 2px 10px; }
    .count { color: #4A5F5C; font-size: 14px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Exercise 2 · Add & Remove Tasks</h1>
  <p class="intro">The list is an array in state. Adding uses the spread operator, removing uses filter, so the old array is never changed.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function TaskList() {
      const [tasks, setTasks] = useState([]);
      const [input, setInput] = useState("");

      function addTask(e) {
        e.preventDefault();
        const text = input.trim();
        if (!text) return;                       // ignore empty input
        setTasks((prev) => [...prev, { id: Date.now(), text }]);
        setInput("");
      }

      function removeTask(id) {
        setTasks((prev) => prev.filter((t) => t.id !== id));
      }

      return (
        <div className="box">
          <form className="row" onSubmit={addTask}>
            <label htmlFor="new-task" style={{ position: "absolute", left: "-9999px" }}>New task</label>
            <input id="new-task" value={input} onChange={(e) => setInput(e.target.value)} placeholder="e.g. Finish Week 12 homework" />
            <button type="submit">Add</button>
          </form>

          {tasks.length === 0 ? (
            <p className="count">No tasks yet. Type one and press Add (or Enter).</p>
          ) : (
            <>
              <ul className="tasks">
                {tasks.map((task) => (
                  <li key={task.id}>
                    {task.text}
                    <button type="button" className="x" aria-label={"Remove " + task.text} onClick={() => removeTask(task.id)}>✕</button>
                  </li>
                ))}
              </ul>
              <p className="count">{tasks.length} task(s)</p>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TaskList />);
  </script>
</body>
</html>
