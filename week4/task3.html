<!DOCTYPE html>
<html>
<body style="font-family:system-ui;padding:20px;max-width:400px;margin:auto">

  <style>
    h2 { color: #1a56db; }
    .add-row { display:flex; gap:8px; margin-bottom:14px; }
    input {
      flex:1;
      padding:8px 12px;
      border:2px solid #c8d4f0;
      border-radius:8px;
      font-size:15px;
    }
    button {
      padding:8px 16px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }
    .add-btn { background:#1a56db; color:white; }
    #todo-list { list-style:none; padding:0; }
    .todo-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 14px;
      margin-bottom:6px;
      background:#f0f4ff;
      border-radius:8px;
      border:1px solid #c8d4f0;
    }
    .del-btn {
      background:#dc2626;
      color:white;
      padding:4px 10px;
      font-size:12px;
      border-radius:6px;
    }
    #empty-msg {
      color:#9ca3af;
      text-align:center;
      padding:20px;
      display:none;
    }
  </style>

  <h2>My To-Do List</h2>

  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>

  <ul id="todo-list"></ul>

  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    // 1. Select elements
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const todoList = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    // Show or hide empty message
    function updateEmptyMessage() {
      if (todoList.children.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
      }
    }

    // 2. Function to add a task
    function addTask() {
      const taskText = input.value.trim();

      // Skip if input is empty
      if (taskText === '') {
        return;
      }

      // Create li
      const li = document.createElement('li');
      li.classList.add('todo-item');

      // Create task text
      const span = document.createElement('span');
      span.textContent = taskText;

      // Create delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '✕';
      deleteBtn.classList.add('del-btn');

      // Add text and button to li
      li.appendChild(span);
      li.appendChild(deleteBtn);

      // Add li to list
      todoList.appendChild(li);

      // Clear input
      input.value = '';

      // Update empty message
      updateEmptyMessage();
    }

    // 3. Add button click
    addBtn.addEventListener('click', addTask);

    // 4. Press Enter to add
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // 5. Event delegation for delete buttons
    todoList.addEventListener('click', function(e) {
      if (e.target.classList.contains('del-btn')) {
        e.target.parentElement.remove();

        // Update empty message
        updateEmptyMessage();
      }
    });

    // Initial empty message
    updateEmptyMessage();
  </script>

</body>
</html>
