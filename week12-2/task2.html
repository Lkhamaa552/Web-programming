<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 12-2 · Exercise 2: Fetch a User</title>
  <!-- React + Babel from a CDN, so JSX works in one HTML file -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 20px; background: #F3F6F5; color: #172B2A; line-height: 1.6; }
    h1 { color: #1E7466; margin-bottom: 4px; }
    .intro { color: #4A5F5C; margin-top: 0; }
    .box { background: #fff; border: 1px solid #D5DFDC; border-radius: 14px; padding: 20px 22px; margin-top: 20px; }
    button { font-family: inherit; font-size: 15px; padding: 8px 16px; border-radius: 8px; border: 1px solid #1E7466; background: #1E7466; color: #fff; cursor: pointer; }
    button.light { background: #fff; color: #1E7466; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #F5B642; outline-offset: 2px; }
    input { font: inherit; padding: 8px 12px; border: 1px solid #B9CCC7; border-radius: 8px; }
    .error { color: #9B1C1C; background: #FDECEC; padding: 10px 12px; border-radius: 8px; }
    .muted { color: #4A5F5C; }
    .user h2 { margin: 0 0 4px; }
    .user p { margin: 4px 0; }
    .ids { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  </style>
</head>
<body>
  <h1>Exercise 2 · Fetch a User from an API</h1>
  <p class="intro">useEffect fetches a user from JSONPlaceholder when the page opens and when the user id changes. It shows loading and error states.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function UserProfile() {
      const [userId, setUserId] = useState(1);
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      useEffect(() => {
        const controller = new AbortController();
        setLoading(true);
        setError("");

        fetch(`https://jsonplaceholder.typicode.com/users/${userId}`, { signal: controller.signal })
          .then((res) => {
            if (!res.ok) throw new Error(`Request failed (${res.status})`);
            return res.json();
          })
          .then((data) => { setUser(data); setLoading(false); })
          .catch((err) => {
            if (err.name === "AbortError") return;   // cancelled on purpose
            setError(err.message);
            setLoading(false);
          });

        // Cleanup: cancel the old request if the id changes quickly
        return () => controller.abort();
      }, [userId]);

      return (
        <div className="box">
          <div className="ids">
            {[1, 2, 3, 4, 5].map((id) => (
              <button key={id} type="button" className={id === userId ? "" : "light"} onClick={() => setUserId(id)}>User {id}</button>
            ))}
          </div>
          {loading && <p className="muted" role="status">Loading…</p>}
          {error && <p className="error" role="alert">{error}</p>}
          {!loading && !error && user && (
            <div className="user">
              <h2>{user.name}</h2>
              <p>📧 {user.email}</p>
              <p>🏙️ {user.address.city}</p>
              <p>🏢 {user.company.name}</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<UserProfile />);
  </script>
</body>
</html>
