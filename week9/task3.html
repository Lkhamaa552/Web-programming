<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 9 - Task 3 | Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      margin-bottom: 8px;
    }

    input:focus {
      outline: 3px solid #b8d5ff;
      border-color: #246bce;
    }

    input[aria-invalid="true"] {
      border: 2px solid #dc2626;
    }

    .error {
      color: #dc2626;
      font-size: 13px;
      margin: 4px 0 15px;
      min-height: 18px;
    }

    .hint {
      color: #666;
      font-size: 13px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #246bce;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #174fa0;
    }

    button:focus-visible {
      outline: 3px solid orange;
      outline-offset: 3px;
    }

    #success {
      color: green;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Sign Up</h1>

    <form id="signupForm" novalidate>

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
        aria-describedby="emailError"
      >

      <p class="error" id="emailError"
         aria-live="polite"></p>

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="new-password"
        required
        aria-describedby="passwordHint passwordError"
      >

      <p class="hint" id="passwordHint">
        Password must be at least 8 characters.
      </p>

      <p class="error" id="passwordError"
         aria-live="polite">
      </p>

      <button type="submit">
        Create account
      </button>

      <p id="success" role="status"
         aria-live="polite"></p>

    </form>

  </main>

  <script>
    const form = document.getElementById("signupForm");

    const email = document.getElementById("email");
    const password = document.getElementById("password");

    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    const success = document.getElementById("success");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      let valid = true;

      emailError.textContent = "";
      passwordError.textContent = "";
      success.textContent = "";

      email.removeAttribute("aria-invalid");
      password.removeAttribute("aria-invalid");

      if (!email.value.trim() ||
          !email.validity.valid) {

        emailError.textContent = "Please enter a valid email address.";

        email.setAttribute("aria-invalid", "true");

        valid = false;
      }

      if (password.value.length < 8) {

        passwordError.textContent =
          "Password too short. Must be at least 8 characters.";

        password.setAttribute("aria-invalid", "true");

        valid = false;
      }

      if (!valid) {
        return;
      }

      success.textContent =
        "Account form submitted successfully!";

      form.reset();

    });

  </script>

</body>
</html>
