<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 9 - Task 1</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    .btn {
      display: inline-block;
      background: #1a7f5a;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border: none;
    }

    button:focus-visible {
      outline: 3px solid #1a56db;
      outline-offset: 3px;
    }

    .close-btn {
      margin-left: 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <p>Try pressing Tab then Enter:</p>

  <button type="button" class="btn">
    Submit form
  </button>

  <button
    type="button"
    class="close-btn"
    aria-label="Close dialog">
    ✕
  </button>

  <div id="result"
       style="margin-top:16px;font-size:14px;color:#666">
  </div>

  <script>
    document.querySelectorAll('button').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('result').textContent =
          '✅ Activated! (works by keyboard and mouse)';
      });
    });
  </script>

</body>
</html>
