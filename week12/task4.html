<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 12 · Code Challenge: Counter with History</title>
  <!-- React + Babel from a CDN, so JSX works in one HTML file -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 20px; background: #F3F6F5; color: #172B2A; line-height: 1.6; }
    h1 { color: #1E7466; margin-bottom: 4px; }
    .intro { color: #4A5F5C; margin-top: 0; }
    .box { background: #fff; border: 1px solid #D5DFDC; border-radius: 14px; padding: 20px 22px; margin-top: 20px; }
    button { font-family: inherit; font-size: 15px; padding: 8px 16px; border-radius: 8px; border: 1px solid #1E7466; background: #1E7466; color: #fff; cursor: pointer; }
    button.light { background: #fff; color: #1E7466; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #F5B642; outline-offset: 2px; }
    .count { font-size: 64px; font-weight: 700; text-align: center; color: #1E7466; margin: 0; }
    .buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .history { text-align: center; color: #4A5F5C; margin: 8px 0 0; font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <h1>Code Challenge · Counter with History</h1>
  <p class="intro">Two state variables: count and history (an array). +1, −1, Reset and Undo. History shows the last 5 values.</p>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function CounterWithHistory() {
      const [count, setCount] = useState(0);
      const [history, setHistory] = useState([0]);   // every value the count has had

      // Change the count AND add the new value to history
      function update(newValue) {
        setCount(newValue);
        setHistory((prev) => [...prev, newValue]);
      }

      function undo() {
        if (history.length < 2) return;              // nothing to undo
        const previous = history[history.length - 2];
        setCount(previous);
        setHistory((prev) => prev.slice(0, -1));     // remove the last item
      }

      const lastFive = history.slice(-5);

      return (
        <div className="box">
          <p className="count" aria-live="polite">{count}</p>
          <div className="buttons">
            <button type="button" onClick={() => update(count + 1)}>+1</button>
            <button type="button" onClick={() => update(count - 1)}>−1</button>
            <button type="button" className="light" onClick={() => update(0)}>Reset</button>
            <button type="button" className="light" onClick={undo} disabled={history.length < 2}>Undo</button>
          </div>
          <p className="history">History: [{lastFive.join(", ")}]</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CounterWithHistory />);
  </script>
</body>
</html>
