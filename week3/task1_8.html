<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>
  <style>
    /* 1. Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. Base styles (body, a, h1-h3, p) */
    body {
      font-family: sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    h1, h2, h3 {
      margin-bottom: 15px;
    }

    p {
      margin-bottom: 15px;
    }

    /* 3. Navigation (.nav, .nav-logo, .nav-links, .nav-links a) */
    .nav {
      background-color: #1e293b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .nav-logo {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      color: white;
    }

    .nav-links a:hover {
      color: #10b981;
    }

    /* 4. Hero section (.hero, .hero h1, .hero p, .btn) */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background-color: #ecfdf5;
    }

    .hero h1 {
      font-size: 3rem;
      color: #15803d;
    }

    .hero p {
      color: #64748b;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background-color: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #059669;
    }

    /* 5. Skills grid (.skills-section, .skills-grid, .skill-card) */
    .skills-section {
      padding: 60px 40px;
      text-align: center;
    }

    .skills-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      max-width: 900px;
      margin: 30px auto 0;
    }

    .skill-card {
      background-color: white;
      padding: 30px;
      flex: 1;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .skill-card h3 {
      color: #15803d;
    }

    .skill-card p {
      color: #64748b;
    }

    /* 6. Footer (.footer) */
    .footer {
      background-color: #1e293b;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>
    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Learning CSS!</h1>
    <p>Week 3 · CSS Introduction · Gachon University</p>
    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>
    <div class="skills-grid">
      <div class="skill-card">
        <h3>HTML5</h3>
        <p>Structure and semantics</p>
      </div>

      <div class="skill-card">
        <h3>CSS3</h3>
        <p>Styling and layout</p>
      </div>

      <div class="skill-card">
        <h3>Flexbox</h3>
        <p>Modern layout model</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>K0126002 Web Programming &copy; 2026 Gachon University</p>
  </footer>
</body>
</html>
