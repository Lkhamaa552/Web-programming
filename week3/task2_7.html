<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My CSS Advanced Page</title>
<style>
  /* 1. :root variables + dark mode */
  :root {
    --bg: #f8fafc;
    --text: #0f172a;
    --muted: #475569;
    --card: #ffffff;
    --accent: #15803d;
    --border: #e2e8f0;
    --nav-height: 60px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --card: #1e293b;
      --accent: #4ade80;
      --border: #334155;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding-top: var(--nav-height); /* space for the fixed nav */
  }

  /* 2. Fixed nav */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-height);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    background-color: var(--card);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  nav span {
    font-weight: bold;
    color: var(--accent);
  }

  nav a {
    color: var(--text);
    text-decoration: none;
    margin-left: 16px;
  }

  nav a:hover { color: var(--accent); }

  /* 3. @keyframes fadeIn + hero */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero {
    text-align: center;
    padding: 80px 24px;
    animation: fadeIn 1s ease-out;
  }

  .hero h1 {
    font-size: 2.5rem;
    margin: 0 0 12px;
  }

  .hero p {
    color: var(--muted);
    margin: 0;
  }

  /* 4. Responsive grid with ::before icons + hover */
  .skills-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 400px; /* extra space so the sticky heading can be seen */
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .card::before {
    content: attr(data-icon);
    display: block;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  /* 5. Sticky section headings */
  .sticky-h2 {
    position: sticky;
    top: var(--nav-height);
    background-color: var(--bg);
    padding: 12px 0;
    margin: 0 0 16px;
    z-index: 5;
  }
</style>
</head>
<body>
  <nav>
    <span>Aranjmaa Lkhamaa</span>
    <div><a href="#">Home</a> <a href="#skills">Skills</a></div>
  </nav>
  <section class="hero">
    <h1>Hello, I am Aranjmaa Lkhamaa</h1>
    <p>Web Programming student · Gachon University · Week 3 CSS Advanced</p>
  </section>
  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🌐">HTML5</div>
      <div class="card" data-icon="🎨">CSS3</div>
      <div class="card" data-icon="⚡">JavaScript</div>
    </div>
  </section>
</body>
</html>
