<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 11 · Exercise 2: Notifications</title>
  <!-- React + Babel from a CDN, so JSX works in one HTML file -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 20px; background: #F3F6F5; color: #172B2A; line-height: 1.6; }
    h1 { color: #1E7466; margin-bottom: 4px; }
    .intro { color: #4A5F5C; margin-top: 0; }
    .list { list-style: none; padding: 0; margin-top: 20px; }
    .note { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; border-left: 5px solid #8FA5A0; }
    .note.success { border-left-color: #1E7466; }
    .note.warning { border-left-color: #B45309; }
    .icon { font-size: 20px; }
    .empty { color: #4A5F5C; }
  </style>
</head>
<body>
  <h1>Exercise 2 · Notifications</h1>
  <p class="intro">An array is rendered with .map() and a stable key. The icon is chosen with conditional rendering.</p>
  <div id="root"></div>

  <script type="text/babel">
    const notifications = [
      { id: 1, type: "success", message: "Week 9-2 accessibility report uploaded." },
      { id: 2, type: "warning", message: "Week 11 homework is due soon." },
      { id: 3, type: "info",    message: "New study guide: React Components & Props." },
      { id: 4, type: "success", message: "Portfolio site is live on GitHub Pages." }
    ];

    // One notification. The icon depends on the type.
    function NotificationItem({ type, message }) {
      let icon;
      if (type === "success") icon = "✅";
      else if (type === "warning") icon = "⚠️";
      else icon = "ℹ️";

      return (
        <li className={"note " + type}>
          <span className="icon" aria-hidden="true">{icon}</span>
          <span>{message}</span>
        </li>
      );
    }

    function NotificationList({ items }) {
      // Early return when the list is empty
      if (items.length === 0) {
        return <p className="empty">No notifications.</p>;
      }
      return (
        <ul className="list">
          {items.map((n) => (
            <NotificationItem key={n.id} type={n.type} message={n.message} />
          ))}
        </ul>
      );
    }

    function App() {
      return (
        <>
          <p>You have {notifications.length} notifications.</p>
          <NotificationList items={notifications} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
