/* ============================================================
   Web Programming — Course Portfolio
   Aranjmaa Lkhamaa
   ============================================================ */

:root {
  --bg: #F3F6F5;
  --card: #FFFFFF;
  --accent: #1E7466;
  --accent-dark: #175E53;
  --accent-tint: #E8F2EF;
  --text: #172B2A;
  --muted: #5F6E6A;
  --border: #E2E9E6;

  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Nunito Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

  --radius: 18px;
  --shadow: 0 10px 30px rgba(23, 43, 42, 0.06);
  --shadow-hover: 0 16px 40px rgba(23, 43, 42, 0.10);
  --max: 1360px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-padding-top: 100px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--accent); }

a:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.wrap {
  width: 100%;
  max-width: var(--max);
  margin-inline: auto;
  padding-inline: 32px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.nowrap { white-space: nowrap; }

.skip-link {
  position: absolute;
  left: 16px;
  top: -60px;
  background: var(--text);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  z-index: 100;
  text-decoration: none;
}
.skip-link:focus { top: 12px; }

/* ---------- Navbar ---------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 84px;
}

/* The logo is only shown on small screens, next to the Menu button */
.logo {
  display: none;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.5rem;
  color: var(--text);
  text-decoration: none;
}

.site-nav ul {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
}

.site-nav a {
  display: block;
  padding: 10px 18px;
  border-radius: 9px;
  font-size: 1.125rem;
  font-weight: 700;
  color: #4F625E;
  text-decoration: none;
  transition: color 0.15s ease, background-color 0.15s ease;
}
.site-nav a:hover { color: var(--accent); background: var(--accent-tint); }
.site-nav a.is-active,
.site-nav a.is-active:hover { color: #FFFFFF; background: var(--accent); }

.menu-toggle {
  display: none;
  font: 700 1rem var(--sans);
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 16px;
  cursor: pointer;
}

@media (max-width: 900px) {
  .header-inner {
    justify-content: space-between;
    flex-wrap: wrap;
    align-content: flex-start;
    min-height: 0;
    padding-top: 14px;
    padding-bottom: 14px;
    row-gap: 12px;
  }
  .logo { display: block; }
  .site-nav { width: 100%; }
  .site-nav ul { justify-content: flex-start; }

  .js .menu-toggle { display: inline-block; }
  .js .site-nav { display: none; }
  .js .site-nav.is-open { display: block; }
  .js .site-nav ul { flex-direction: column; align-items: stretch; gap: 4px; }
}

/* ---------- Hero ---------- */

.eyebrow {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}

.hero {
  padding-top: clamp(56px, 8vw, 96px);
  padding-bottom: clamp(40px, 5vw, 56px);
}

.hero h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(3.25rem, 8.5vw, 6.5rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin-top: 22px;
}

.hero-student {
  margin-top: 26px;
  font-size: 1.3125rem;
  color: var(--text);
}

.hero-desc {
  margin-top: 26px;
  max-width: 44em;
  font-size: 1.375rem;
  line-height: 1.7;
  color: var(--muted);
}

/* ---------- Week cards ---------- */

.weeks { padding-bottom: 96px; }

.week-grid {
